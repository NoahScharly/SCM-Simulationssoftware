id: S5
name: Nachfrageeinbruch -40 % für 60 Tage
kurz: Nachfrageeinbruch
beschreibung: Nach einem Imageschaden (z. B. Qualitäts- oder Lieferkettenskandal) bricht die Nachfrage ab Tag 150 für 60 Tage um 40 % ein. Testet die Gegenrichtung zu den übrigen Szenarien, also Überbestand und Kapitalbindung statt Fehlmengen (Idee Gruppenposter, Werte [A])
relevante_optionen: [keine, puffer, saisonbestand]   # zeigt, was zusätzlicher Bestand kostet, wenn er nicht gebraucht wird
stoerungen:
  - typ: nachfrage
    faktor: 0.6
    start_tag: 150
    dauer_tage: 60
sensitivitaet:                  # Bandbreite: wird in der Oberfläche durchgerechnet (Abschnitt Bandbreite)
  stoerungen.0.faktor: [0.8, 0.6, 0.4]
