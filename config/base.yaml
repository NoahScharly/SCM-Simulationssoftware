# Basiskonfiguration: Normalbetrieb (S0)
# Alle Werte mit [A] sind Modellannahmen und in der Sensitivitätsanalyse zu prüfen.
# Szenarien in config/scenarios/ ändern nur einzelne Werte dieser Datei.

simulation:
  auswertung_tage: 365          # ausgewerteter Zeitraum (1 Jahr)
  einschwingen_tage: 200        # Vorlauf, der nicht ausgewertet wird (> längste WBZ) [A]
  replikationen: 20             # Monte-Carlo-Läufe je Szenario
  seed: 20261110                # Master-Seed für alle Zufallsströme

nachfrage:
  uhren_pro_jahr: 5000          # Regler 0 bis 25.000
  monatsfaktoren: {}            # z. B. {11: 1.3, 12: 1.3}; fehlende Monate = 1.0
  online_anteil: 1.0            # nur Onlineverkauf, Versand per Paket direkt ab Heilbronn

montage:
  kapazitaet_pro_tag: auto      # auto = aus Jahresmenge: Mitarbeiter × Uhren je Mitarbeiter; oder feste Zahl
  uhren_pro_mitarbeiter_tag: 5  # Festlegung N. Scharly: Einschalen, Zeiger, Armband, Endkontrolle mit zugekauften
                                # Werken, ca. 5 Uhren je Uhrmacher und Tag; Sensitivität 2/3/5/7
  stellen_raster: 0.5           # Stellen werden auf halbe Stellen aufgerundet (Teilzeit), Entscheidung N. Scharly:
                                # 5.000 Uhren brauchen 4,04 Stellen, besetzt 4,5 statt 5 volle; 1.0 = nur Vollzeit
  arbeitstage_pro_woche: 5
  gutquote: 0.99                # fest: 1 % Ausschuss, ohne Zufall (Bruchteile werden übertragen) [A]
  durchlauf_tage: 1             # Montage und Endprüfung [A]
  fertigwaren_ziel_tage: 10     # Zielreichweite Fertigwarenlager in Tagen Nachfrage [A]

distribution:
  lieferzusage_tage: 3          # Poster: Lieferzeit höchstens 3 Tage
  lieferzeit_einheit: werktage  # werktage | kalendertage (übliche Zusage: Werktage) [A]
  versand_tage: [1, 1, 2]       # Paketlaufzeit Dreieck, nur falls keine Kunden-Datei vorhanden [A]
  # Kunden: jede Bestellung geht an eine zufällige Stadt aus config/kunden.csv, gewichtet nach Einwohnern.
  # Die Paketlaufzeit hängt von der Luftlinie ab Heilbronn ab (Dreieck min, modus, max in Tagen) [A]:
  versand_zonen:
    - {bis_km: 250, tage: [1, 1, 1.5]}      # Baden-Württemberg, Bayern, Rhein-Main
    - {bis_km: 450, tage: [1, 1.25, 2]}     # Ruhrgebiet, Sachsen, Hannover
    - {bis_km: 99999, tage: [1, 1.5, 2.5]}  # Berlin, Hamburg, Küste
  strassenfaktor: 1.3           # Straßen-km = Luftlinie × 1,3 [A]
  hauptlauf_g_tkm: 101          # GLEC Sattelzug 34 bis 40 t: Paket-Hauptlauf Heilbronn bis Zustelldepot
  last_mile_km: 30              # Zustelldepot bis Haustür, Transporter < 3,5 t [A]

transport:
  geschwindigkeit_km_tag: {see: 800, bahn: 400, binnen: 250, lkw: 600, luft: 8000}
  umschlag_tage: {see: [1, 2, 4], bahn: [0.5, 1, 2], binnen: [0.5, 1, 2], lkw: [0, 0.5, 1], luft: [1, 1.5, 3]}
  umleitung_km: 150             # Schiff unterwegs, Zielhafen gesperrt: Umweg zum Ausweichhafen (Elbe-Weser) [A]
  umleitung_tage: 0.5           # Umplanung und Anlaufen des Ausweichhafens [A]
  zoll_tage: [0.5, 1, 2]        # Zollabfertigung Drittland, Dreieck [A]. Zollsatz überall 0 % (EPA Japan, FHA Schweiz,
                                # Interim-EPA Mauritius, Mercosur vorläufig ab 1.5.2026, EU-US-Zollverordnung 2026),
                                # Anmeldung, Ursprungsnachweis und Einfuhrumsatzsteuer bleiben aber nötig

kosten:
  transport_eur_tkm: {see: 0.02, bahn: 0.06, binnen: 0.05, lkw: 0.15, luft: 3.0}     # [A]
  transport_fix_eur_sendung: {see: 250, bahn: 90, binnen: 90, lkw: 60, luft: 180}   # [A]
  umschlag_eur_t: 40            # je Umschlag [A]
  kapitalzins_pa: 0.08          # kalkulatorischer Zins [A]
  lagerrisiko_pa: 0.07          # Versicherung, Schwund, Veralterung; zusammen 15 % Lagerhaltungskostensatz wie bei
                                # B. Hufgard und P. Maywald (übliche Spanne 15 bis 25 %, Logistik-Journal) [A]
  lager_eur_stueck_tag: 0.002   # Lagerplatz je Komponente [A]
  montage_kostenmodell: personal   # personal = Fixkosten der Stammbelegschaft je Arbeitstag (auch bei Leerlauf);
                                # stueck = montage_eur_uhr je montierter Uhr (alter Stand, nur zum Vergleich)
  lohnkosten_eur_h: 49.50       # Arbeitskosten je Stunde Verarbeitendes Gewerbe (Destatis 2026, übernommen aus dem
                                # Poster P. Maywald) [prüfen]
  stunden_ma_jahr: 1680         # 140 Arbeitsstunden je Person und Monat (P. Maywald) [A]
                                # -> rund 83.000 € je Mitarbeiter und Jahr
  montage_eur_uhr: 25           # nur bei montage_kostenmodell: stueck [A]
  paket_eur_uhr: 6              # [A]
  verspaetung_eur_auftrag: 50   # Fehlmengenkosten je verspätetem Auftrag (Rabatt, entgangener Deckungsbeitrag, Image) [A];
                                # High-End Cars-Uhr für Sammler (800 bis 1.200 €): Verspätung wiegt schwerer,
                                # deshalb 50 € statt 20 €; Sensitivität 20/50/100 €

emissionen:
  umschlag_kg_t: 1.2            # GLEC Umschlag
  last_mile_g_tkm: 840          # GLEC Transporter < 3,5 t
  paket_kg: 0.3                 # [A]
  verpackungsfaktor: 1.5        # Bruttogewicht / Nettogewicht [A]

bestand:
  servicegrad_ziel: 0.95        # für Sicherheitsbestand der Komponenten
  bestellintervall_min_tage: 30 # Mindestlosgröße = Bedarf dieser Tage [A]

massnahmen:
  puffer_extra: {}              # zusätzlicher Sicherheitsbestand, z. B. {uhrwerk: 1000}
  sellita_notfall: false        # Notfallplan: fällt der Uhrwerk-Lieferant Miyota (oder sein Vorlieferant) aus, wird nach
                                # der Reaktionszeit bei Sellita (SW300-1, La Chaux-de-Fonds) bestellt; offene, noch nicht
                                # versandte Miyota-Aufträge werden storniert. Nach Wiederanlauf zurück zu Miyota.
                                # Annahme: Gehäuse und Zifferblatt-Variante für SW300-1 sind vorab freigegeben.
  notfall_reaktion_tage: 3      # Ausfallmeldung bis erste Bestellung beim Ersatzlieferanten [A]
  notfall_hochlauf_tage: 14     # Reserve fertigt erst nach dem Hochlauf (Material, Fertigungsslot) [A]
  notfall_kapazitaet_stk_woche: 150   # Sellita teilt einem Kleinkunden nur ein Kontingent zu, rund 1,5-facher
                                      # Wochenbedarf bei 5.000 Uhren/Jahr [A]
  notfall_bereitschaft_eur_jahr: 4000 # Qualifizierung, Musterfreigabe, Rahmenvertrag; fällt auch ohne Ausfall an
                                      # (Wert und Idee aus dem Konzept B. Hufgard) [A]
  luftfracht_notfall: false     # Eilbezug per Luftfracht bei drohendem Fehlteil
  luft_ausloeser_tage: 8        # Reichweite, ab der Luftfracht ausgelöst wird; muss über der Luft-WBZ liegen
                                # (2 Tage Eilfertigung + Lkw + Flug + Zoll + Umschlag = rund 6 bis 7 Tage)
  luft_menge_tage: 15           # Bedarf, der per Luft nachgeliefert wird (Reichweiten-Auslöser)
  luft_bei_wiederanlauf: true   # nach Lieferantenausfall: erste Lieferung als Brücke per Flugzeug
  luft_nur_im_stoerfall: true   # Reichweiten-Auslöser nur bei Versorgungsstörung der Komponente (Lieferant,
                                # Vorlieferant, Knoten oder Kante der Route) und im Nachlauf, nie im Normalbetrieb
  luft_nachlauf_tage: 90        # so lange nach Störungsende darf noch geflogen werden (rund längste WBZ) [A]
  luft_eilzuschlag: 0.25        # Aufschlag auf den Stückpreis für Eilfertigung und Priorisierung [A]
  ausweichroute: false          # gesperrte Abschnitte umfahren (Bahn statt Binnenschiff, Bremerhaven statt Hamburg);
                                # ohne diese Maßnahme wartet die Ware, bis der reguläre Weg wieder frei ist
  aushilfe: {}                  # Aushilfe bei Montagerückstand (Idee P. Maywald), z. B.
                                # {mitarbeiter: 1, ausloeser_tage: 5, mindest_tage: 10, aufschlag: 0.3}
  # Teilzeit aufstocken = Aushilfe-Mechanik mit eigener Teilzeitkraft: {mitarbeiter: 0.5, aufschlag: 0, ...}
  saison_bestand: {}            # Saisonbestand: z. B. {monate: [8, 9, 10, 11], extra_tage: 20} hebt den Meldebestand
                                # aller Komponenten vor der Spitze an (Aufbau ab August wegen langer WBZ)
  saison_vorproduktion: {}
  bestand_anpassen: {}          # Nachfrageeinbruch: Meldebestand und Bestellmenge folgen der gesunkenen Nachfrage, z. B.
                                # {reaktion_tage: 7}; Einbruch und Erholung werden erst nach so vielen Tagen erkannt [A]
  kurzarbeit: {}                # Nachfrageeinbruch: Arbeitszeit der Stammbelegschaft sinkt mit der Nachfrage, z. B.
                                # {reaktion_tage: 14, remanenz: 0.25}; Remanenzkosten = Anteil der Personalkosten,
                                # der für ausgefallene Stunden trotzdem anfällt (Sozialversicherung, Urlaub) [A]      # z. B. {monate: [10, 11, 12], ziel_tage: 30} höherer Fertigwarenvorrat

handlungsoptionen:              # werden nach dem Start für jedes gewählte Szenario automatisch durchgerechnet
  - id: keine                   # Referenz: nur die eingebauten Reaktionen des Modells
    name: Ohne Maßnahme
    kurz: Ohne Maßnahme
    beschreibung: Nur das Bestellpunktverfahren; bei einer Sperre wartet die Ware, bis der reguläre Weg wieder frei
      ist; keine zusätzliche Vorsorge
    massnahmen: {}
  - id: ausweichroute
    name: Ausweichroute (Bahn / Bremerhaven)
    kurz: Ausweichroute
    beschreibung: Gesperrte Abschnitte werden umfahren, Bahn Rotterdam-Heilbronn statt Binnenschiff über Kaub,
      Bremerhaven statt Hamburg; ohne diese Maßnahme wartet die Ware vor der Sperre
    massnahmen: {ausweichroute: true}
  - id: puffer_500
    name: Uhrwerk-Puffer +500 Stück
    kurz: Puffer 500
    beschreibung: Zusätzlicher Sicherheitsbestand an Uhrwerken in Heilbronn, wirkt immer und bindet immer Kapital
    massnahmen: {puffer_extra: {uhrwerk: 500}}
  - id: puffer_750
    name: Uhrwerk-Puffer +750 Stück
    kurz: Puffer 750
    beschreibung: Zusätzlicher Sicherheitsbestand an Uhrwerken in Heilbronn, wirkt immer und bindet immer Kapital
    massnahmen: {puffer_extra: {uhrwerk: 750}}
  - id: puffer_1000
    name: Uhrwerk-Puffer +1.000 Stück
    kurz: Puffer 1.000
    beschreibung: Zusätzlicher Sicherheitsbestand an Uhrwerken in Heilbronn, wirkt immer und bindet immer Kapital
    massnahmen: {puffer_extra: {uhrwerk: 1000}}
  - id: sellita
    name: Notfallplan Sellita (Ersatz-Uhrwerk)
    kurz: Ersatz-Uhrwerk
    beschreibung: Fällt Miyota aus, wird nach der Reaktionszeit bei Sellita (CH) bestellt, doppelter Preis, Lkw statt
      Schiff; Sellita braucht 14 Tage Hochlauf, liefert höchstens 150 Stück je Woche, und der Notfallplan kostet
      4.000 € im Jahr Bereitschaft, auch wenn er nie gebraucht wird
    massnahmen: {sellita_notfall: true}
  - id: luftfracht
    name: Notfallplan Luftfracht
    kurz: Luftfracht
    beschreibung: Nach einem Lieferantenausfall kommt die erste Lieferung als Brücke per Flugzeug (Eilfertigung mit
      Aufschlag), danach wieder Seeweg; zusätzlich Eilbezug, wenn die Reichweite unter den Auslöser fällt
    massnahmen: {luftfracht_notfall: true}
  - id: aushilfe
    name: Aushilfe in der Montage
    kurz: Aushilfe
    beschreibung: Liegt die Montage mehr als 5 Tagesbedarfe hinter dem Plan und sind Teile da, kommt eine Aushilfe
      (Zeitarbeit, 30 % teurer als eigenes Personal) für mindestens 10 Arbeitstage und bleibt, bis der Rückstand
      aufgeholt ist
    massnahmen: {aushilfe: {mitarbeiter: 1, ausloeser_tage: 5, mindest_tage: 10, aufschlag: 0.3}}
  - id: aufstocken
    name: Teilzeit aufstocken
    kurz: Teilzeit aufstocken
    beschreibung: Liegt die Montage mehr als 5 Tagesbedarfe hinter dem Plan und sind Teile da, geht die halbe Stelle
      für mindestens 10 Arbeitstage auf Vollzeit (eigene Mitarbeiterin, kein Zeitarbeitsaufschlag), bis der Rückstand
      aufgeholt ist; nur sinnvoll, solange die Grundbesetzung eine Teilzeitstelle enthält
    massnahmen: {aushilfe: {mitarbeiter: 0.5, ausloeser_tage: 5, mindest_tage: 10, aufschlag: 0.0}}
  - id: vorproduktion
    name: Vorproduktion vor der Saison
    kurz: Vorproduktion
    beschreibung: Von Juli bis Dezember nutzt die Montage ihre freie Kapazität und legt fertige Uhren für 40 Tage
      Bedarf auf Lager (sonst 10 Tage). Kostet kaum etwas, bindet aber Kapital in Fertigwaren, und die Uhren sind
      schon gebaut, falls die Spitze ausbleibt
    massnahmen: {saison_vorproduktion: {monate: [7, 8, 9, 10, 11, 12], ziel_tage: 40}}
  - id: bestand_absenken
    name: Bestand an Nachfrage anpassen
    kurz: Bestand absenken
    beschreibung: Wird der Einbruch erkannt (nach 7 Tagen), sinken Meldebestand und Bestellmengen aller Komponenten
      im selben Verhältnis wie die Nachfrage. Spart gebundenes Kapital; Risiko, die Erholung wird ebenfalls erst
      nach 7 Tagen erkannt
    massnahmen: {bestand_anpassen: {reaktion_tage: 7}}
  - id: kurzarbeit
    name: Kurzarbeit in der Montage
    kurz: Kurzarbeit
    beschreibung: Wird der Einbruch erkannt (nach 14 Tagen, Antrag und Abstimmung), arbeitet die Montage nur
      entsprechend der Nachfrage; für ausgefallene Stunden bleiben 25 % der Personalkosten (Remanenzkosten).
      Risiko, nach der Erholung fehlt 14 Tage lang Montagekapazität
    massnahmen: {kurzarbeit: {reaktion_tage: 14, remanenz: 0.25}}

entscheidung:                   # Empfehlung im Optionsvergleich (Oberfläche Abschnitt 1 bis 3), dort änderbar
  anforderungen:                # Stufe 1: Mindestanforderungen (Grenze je Zielkriterium)
    beta: 0.95                  # Lieferfähigkeit mindestens 95 % (Poster: Zielkriterium mit Mindestwert)
    lieferzeit_p95: 3           # 95 % der Kunden spätestens nach 3 Werktagen (= Lieferzusage)
  prioritaet: [beta, kosten_pro_uhr, co2e_pro_uhr_kg, lieferzeit_p95]   # Stufe 2: oben = wichtigst, ROC-Gewichte
                                # Montagestillstand optional: solange lieferfähig, ist kurzer Stillstand kein Problem

bewertung:
  methode: mindestwerte         # mindestwerte | gewichtet | lexikografisch
  mindestwerte: {beta: 0.95}
  gewichte: {kosten_pro_uhr: 0.4, co2e_pro_uhr_kg: 0.3, lieferzeit_p95: 0.3}
  rangfolge: [beta, co2e_pro_uhr_kg, kosten_pro_uhr]

grenzen:                        # Plausibilitätsregeln (Folie 2)
  uhren_pro_jahr: [0, 25000]
  kapazitaet_pro_tag: [1, 150]
  arbeitstage_pro_jahr: 250
  wbz_max_tage: 180

sensitivitaet:                  # One-at-a-time (Folie 11): python -m uhrensim --sensitivitaet
  kosten.verspaetung_eur_auftrag: [20, 50, 100]
  montage.uhren_pro_mitarbeiter_tag: [2, 3, 5, 7]
  transport.zoll_tage: [[0.5, 1, 2], [1, 2, 4]]
  emissionen.verpackungsfaktor: [1.2, 1.5, 1.8]
  massnahmen.luft_eilzuschlag: [0.0, 0.25, 0.5]     # wirkt nur mit Notfallplan Luftfracht (Szenario S1)
  kosten.transport_eur_tkm.luft: [0.6, 3.0]         # Spotrate Linie (BAI 2026) vs. Express-Kleinsendung [A]

stoerungen: []                  # werden von Szenarien gefüllt
